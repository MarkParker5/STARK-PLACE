# STARK-PLACE multi-distribution release.
#
# Monorepo of standalone packages (packages/*), each with its own version and its
# own `<dist-name>-v<version>` tags. Per push we:
#   1. prepare  — plan which packages changed, patch-bump the already-released ones,
#                 commit all bumps in ONE commit (avoids parallel push races).
#   2. release  — matrix over changed packages, fail-fast:false so a red test in one
#                 package never blocks the others; each leg tests+builds+tags+releases
#                 its own package with its own changelog.
#
# The find-links registry is deployed separately by pages.yml, which triggers on this
# workflow's completion (workflow_run) — one Pages deployer avoids concurrent-deploy
# races. The old monolithic `stark-place` build is gone.

name: Release packages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      packages:
        description: "'all', or comma-separated dist names to force-release"
        default: "all"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # tags, releases, the bump commit

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # need full history + tags for diff/changelog
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Plan + apply version bumps
        id: plan
        run: |
          BASE="${{ github.event.before }}"
          # github.event.before is all-zeros on first push to a branch.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=""; fi
          DISPATCH="${{ github.event_name == 'workflow_dispatch' && inputs.packages || '' }}"
          python3 tools/release_plan.py --base "$BASE" --dispatch "$DISPATCH" --apply-bumps

      - name: Commit bumps
        if: steps.plan.outputs.any == 'true'
        run: |
          if ! git diff --quiet -- 'packages/*/pyproject.toml'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "ci: version bump [skip ci]"
            git push
          fi

  release:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one package's failure must not stop the others
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master             # includes the bump commit pushed by prepare

      - name: Build + test ${{ matrix.package }}
        id: bt
        uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          dir: ${{ matrix.dir }}

      - name: Per-package changelog
        id: log
        run: |
          RANGE="${{ matrix.prev_tag }}..HEAD"
          [ -z "${{ matrix.prev_tag }}" ] && RANGE="HEAD"
          {
            echo "body<<EOF"
            echo "### ${{ matrix.package }} ${{ matrix.version }}"
            git log --pretty=format:"- %s" "$RANGE" -- "${{ matrix.dir }}" || true
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tag + release + upload wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ matrix.tag }}" \
            --title "${{ matrix.package }} ${{ matrix.version }}" \
            --notes "${{ steps.log.outputs.body }}" \
            --target "$(git rev-parse HEAD)"
          gh release upload "${{ matrix.tag }}" dist/*.whl dist/*.tar.gz --clobber
