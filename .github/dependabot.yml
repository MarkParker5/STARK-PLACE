version: 2
updates:
  # uv workspace — the root uv.lock covers every packages/* member's deps,
  # so one entry at the root keeps all distributions updated. PRs land on develop.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 10
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      actions:
        patterns: ["*"]
