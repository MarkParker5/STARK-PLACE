# STARK-PLACE — uv workspace root (virtual: not itself a distribution).
# Each publishable module is a separate distribution under packages/*.
# Legacy single-package config preserved in pyproject.legacy.toml during migration.

[tool.uv.workspace]
members = ["packages/*"]

# Tell uv to resolve these names from the workspace (local source) instead of
# an index during development. Add one line per new module.
[tool.uv.sources]
stark-place-core = { workspace = true }
stark-place-ai = { workspace = true }
stark-place-triggers = { workspace = true }

# Dev-only tooling shared across the workspace (not shipped in any wheel).
[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "mypy>=1.5",
]
