# Distribution: stark-devtools  →  import: stark_devtools
# Dev tooling migrated from the STARK repo: the sys.monitoring profiler and the
# web visualizer. Depends on the STARK ENGINE (it profiles/demoes stark.core.*).
# Run: python -m stark_devtools.profiler   (serves the built visualizer)

[project]
name = "stark-devtools"
version = "0.1.2"
description = "Dev tools for S.T.A.R.K. — sys.monitoring profiler + web visualizer (replay, dashboard, wiring, brain)."
requires-python = ">=3.12"        # profiler uses sys.monitoring (PEP 669, 3.12+)
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Mark Parker", email = "mark@parker-programs.com" }]
keywords = ["stark", "stark-place", "profiler", "visualizer", "devtools"]
dependencies = [
    "stark-engine>=4.6,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the profiler package + the BUILT visualizer (dist/), but not the JS source
# tree or node_modules. `artifacts` force-includes dist even though it's gitignored.
[tool.hatch.build.targets.wheel]
packages = ["stark_devtools"]
artifacts = ["stark_devtools/visualizer/dist/**"]
exclude = [
    "stark_devtools/visualizer/src/**",
    "stark_devtools/visualizer/public/**",
    "stark_devtools/visualizer/node_modules/**",
    "stark_devtools/visualizer/*.json",
    "stark_devtools/visualizer/*.ts",
    "stark_devtools/visualizer/index.html",
    "**/*.tsbuildinfo",
]

# Async tests are plain `async def` (no per-test marker); run them under asyncio auto mode.
[tool.pytest.ini_options]
asyncio_mode = "auto"
