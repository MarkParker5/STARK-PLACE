# Distribution: stark-place-ai  →  import: stark_place.ai
# LLM-powered processors for the STARK engine (moved from llm-playground/ready).
# Depends on the STARK ENGINE (stark-engine), not on stark-place-core — these
# extend stark.core.* directly.

[project]
name = "stark-place-ai"
version = "0.1.0"
description = "LLM processors for S.T.A.R.K. — agentic loop, structured & search-parsing, LLM/embedding NER, fallback agent."
requires-python = ">=3.10"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [{ name = "Mark Parker", email = "mark@parker-programs.com" }]
keywords = ["stark", "stark-place", "llm", "nlp", "voice-assistant"]
dependencies = [
    "stark-engine>=4.5,<5",
    "pydantic-ai",
    "pydantic>=2",
    "numpy",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stark_place"]
